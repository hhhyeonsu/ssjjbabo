<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현장 관리 · WeatherWorks</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; margin-bottom: 24px; }
  .project-card { background: #fff; border: 1px solid var(--line, #e2e8f0); border-radius: 8px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.15s ease, box-shadow 0.15s ease; }
  .project-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); }
  .project-card-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
  .project-name { font-size: 16px; font-weight: 700; color: #1e293b; }
  .project-meta { font-size: 12.5px; color: #64748b; line-height: 1.6; margin-bottom: 16px; }

  /* 간트차트 시각화 */
  .gantt-wrap { background: #fff; border: 1px solid var(--line, #e2e8f0); border-radius: 8px; padding: 20px; margin-bottom: 24px; }
  .gantt-header-row { display: flex; border-bottom: 2px solid #cbd5e1; padding-bottom: 10px; font-size: 12px; font-weight: 700; color: #475569; align-items: center; }
  .gantt-time-scale { flex: 1; display: flex; justify-content: space-between; position: relative; padding: 0 4px; }
  .gantt-time-scale::before { content: ''; position: absolute; left: 0; right: 0; bottom: -10px; height: 1px; background: #e2e8f0; }
  .scale-mark { font-size: 11px; color: #94a3b8; font-family: monospace; }

  .gantt-item-row { display: flex; align-items: center; border-bottom: 1px solid #f1f5f9; padding: 12px 0; font-size: 13px; }
  .gantt-item-label { width: 260px; flex-shrink: 0; font-weight: 600; color: #1e293b; padding-right: 12px; box-sizing: border-box; }
  .gantt-timeline-track { flex: 1; position: relative; height: 28px; background: #f8fafc; border-radius: 4px; border: 1px solid #e2e8f0; overflow: hidden; }
  
  .gantt-bar-work { position: absolute; top: 2px; bottom: 2px; border-radius: 4px 0 0 4px; display: flex; align-items: center; padding: 0 8px; color: #fff; font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; z-index: 2; }
  .gantt-bar-weather { position: absolute; top: 2px; bottom: 2px; border-radius: 0 4px 4px 0; background: repeating-linear-gradient(45deg, #cbd5e1, #cbd5e1 6px, #e2e8f0 6px, #e2e8f0 12px); border-left: 1px solid rgba(0,0,0,0.1); display: flex; align-items: center; padding: 0 6px; color: #475569; font-size: 10.5px; font-weight: 700; white-space: nowrap; z-index: 1; }

  .gantt-legend { display: flex; gap: 16px; align-items: center; font-size: 12px; color: #64748b; }
  .legend-box { width: 14px; height: 14px; border-radius: 3px; display: inline-block; vertical-align: middle; margin-right: 5px; }

  /* 모달 */
  .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,0.6); display: none; align-items: center; justify-content: center; z-index: 1000; }
  .modal-dialog { background: #fff; border-radius: 8px; width: 540px; max-width: 90vw; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
  .modal-header { padding: 16px 20px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
  .modal-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .modal-footer { padding: 14px 20px; border-top: 1px solid #e2e8f0; background: #f8fafc; display: flex; justify-content: flex-end; gap: 8px; }
</style>
</head>
<body>
<div id="app-shell">
  <aside id="sidebar"></aside>

  <div class="main">
    <header id="topbar"></header>

    <main id="page-content">
      <div class="page-head row space-between">
        <div>
          <h2>현장 관리</h2>
          <div class="desc">전국 564개 기상관측소 10개년 월평균 비작업일수 전체 통계를 연동한 연속 공정 타임라인(Gantt)입니다.</div>
        </div>
        <div>
          <button class="btn btn-primary" onclick="openNewProjectModal()">+ 신규 현장 등록</button>
        </div>
      </div>

      <div class="project-grid" id="project-list-container"></div>

      <div class="gantt-wrap">
        <div class="row space-between items-center" style="margin-bottom: 16px;">
          <div>
            <h3 style="margin: 0; font-size: 15px; color: #1e293b;">현장별 공정 타임라인 (10개년 관측소 비작업일 연동)</h3>
            <span class="muted" style="font-size: 12px;" id="station-applied-text">관측소 통계 데이터 로딩 중...</span>
          </div>
          <div class="row gap-16 items-center">
            <div class="gantt-legend">
              <span><span class="legend-box" style="background:#2563eb;"></span>순 작업일수(Net)</span>
              <span><span class="legend-box" style="background:repeating-linear-gradient(45deg,#cbd5e1,#cbd5e1 3px,#e2e8f0 3px,#e2e8f0 6px);"></span>10년 평균 비작업일</span>
            </div>
            <select id="sel-gantt-project" class="input" style="width: 240px; font-size: 13px; font-weight:600;" onchange="renderGanttChart(this.value)"></select>
          </div>
        </div>

        <div class="gantt-header-row">
          <div style="width: 260px;">공종 및 세부 품목명</div>
          <div class="gantt-time-scale" id="gantt-scale-header"></div>
          <div style="width: 140px; text-align: right;">순작업 / 총소요공기</div>
        </div>

        <div id="gantt-body"></div>
      </div>
    </main>
  </div>
</div>

<!-- 신규 현장 등록 모달 -->
<div class="modal-backdrop" id="modal-project">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 style="margin:0; font-size:15px;">신규 현장 추가</h3>
      <button onclick="closeModal()" style="border:none; background:none; font-size:18px; cursor:pointer; color:#64748b;">&times;</button>
    </div>
    <div class="modal-body">
      <div>
        <label style="font-size:12px; font-weight:600; color:#64748b;">공사 현장명</label>
        <input type="text" id="m-inp-name" class="input" style="width:100%; margin-top:4px;" placeholder="예: OO지구 공동주택 신축공사">
      </div>
      <div class="row gap-12">
        <div style="flex:1;">
          <label style="font-size:12px; font-weight:600; color:#64748b;">공사 착공일</label>
          <input type="date" id="m-inp-start" class="input" style="width:100%; margin-top:4px;" value="2026-03-01">
        </div>
        <div style="flex:1;">
          <label style="font-size:12px; font-weight:600; color:#64748b;">공사 준공예정일</label>
          <input type="date" id="m-inp-end" class="input" style="width:100%; margin-top:4px;" value="2027-02-28">
        </div>
      </div>
      <div>
        <label style="font-size:12px; font-weight:600; color:#64748b;">현장 소재지 주소 (4,418개 읍면동 자동 매핑)</label>
        <input type="text" id="m-inp-addr" class="input" style="width:100%; margin-top:4px;" placeholder="예: 대전광역시 유성구 덕명동" oninput="autoDetectStation(this.value)">
        <div id="addr-match-guide" style="font-size:12px; color:#2563eb; margin-top:4px; font-weight:600;"></div>
      </div>
      <div>
        <label style="font-size:12px; font-weight:600; color:#64748b;">연계 기상관측소 (자동 검색 또는 선택)</label>
        <select id="m-sel-station" class="input" style="width:100%; margin-top:4px;"></select>
      </div>
      <div>
        <label style="font-size:12px; font-weight:600; color:#64748b;">현장 특이사항</label>
        <textarea id="m-inp-desc" class="input" style="width:100%; height:60px; margin-top:4px; font-size:13px;" placeholder="지하매설물 간섭 구간, 기상 민감 공종 등"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-sm" onclick="closeModal()">취소</button>
      <button class="btn btn-primary btn-sm" onclick="saveNewProject()">현장 등록</button>
    </div>
  </div>
</div>

<script src="js/db.js"></script>
<script src="js/seed.js"></script>
<script src="js/util.js"></script>
<script src="js/calc.js"></script>
<script src="js/nav.js"></script>
<script>
let FULL_WEATHER_DATA = { stations: {}, mapping: {} };

document.addEventListener('DOMContentLoaded', async () => {
  if (typeof renderSidebar === 'function') renderSidebar();
  if (typeof renderTopbar === 'function') renderTopbar('현장 관리');

  // weather-workdays.json 전체 데이터(564개 관측소, 4418개 주소) 로드
  try {
    const res = await fetch('data/weather-workdays.json');
    if (res.ok) {
      FULL_WEATHER_DATA = await res.json();
    }
  } catch (e) {
    console.warn('weather-workdays.json 로드 실패:', e);
  }

  ensureDefaultProjects();
  initStationDropdownModal();
  renderProjectCards();
  initGanttProjectSelector();
});

function initStationDropdownModal() {
  const sel = document.getElementById('m-sel-station');
  const stations = Object.keys(FULL_WEATHER_DATA.stations || {});
  if (stations.length) {
    sel.innerHTML = stations.sort().map(st => `<option value="${st}">${st}</option>`).join('');
    sel.value = stations.includes('계룡') ? '계룡' : stations[0];
  } else {
    sel.innerHTML = '<option value="계룡">계룡 (대전 인접)</option><option value="송악">송악 (아산 인접)</option><option value="아산">아산</option>';
  }
}

// 주소 입력 시 4,418개 매핑 테이블에서 관측소 실시간 자동 감지
function autoDetectStation(addr) {
  const kw = addr.trim();
  const guide = document.getElementById('addr-match-guide');
  const sel = document.getElementById('m-sel-station');
  if (!kw) { guide.innerHTML = ''; return; }

  const mapping = FULL_WEATHER_DATA.mapping || {};
  let matched = mapping[kw];

  if (!matched) {
    // 부분 일치 탐색
    for (const [fullAddr, info] of Object.entries(mapping)) {
      if (fullAddr.includes(kw)) {
        matched = info;
        break;
      }
    }
  }

  if (matched) {
    guide.innerHTML = `✓ 매핑 관측소: <strong>${matched.s}</strong> (거리: ${matched.d}km)`;
    sel.value = matched.s;
  } else {
    guide.innerHTML = '';
  }
}

function ensureDefaultProjects() {
  const db = loadDB();
  if (!db.projects || db.projects.length === 0) {
    db.projects = [
      {
        id: "P_001",
        name: "OO지구 공동주택 신축공사",
        station: "계룡",
        addr: "대전광역시 유성구 덕명동",
        startDate: "2026-03-01",
        endDate: "2027-02-28",
        desc: "토공사 및 구조물 공사 집중 구간",
        status: "공사중"
      },
      {
        id: "P_002",
        name: "△△ 도로 확장공사 2공구",
        station: "송악",
        addr: "충청남도 아산시 배방읍",
        startDate: "2026-05-10",
        endDate: "2026-11-30",
        desc: "지하 관로 매설 및 포장 공사",
        status: "공사중"
      }
    ];
    saveDB(db);
  }
}

// 564개 관측소 10개년 월평균 비작업일수 기반 실계산
function calculateStationNonWorkDays(stationName, workDays, startMonth = 3) {
  const stations = FULL_WEATHER_DATA.stations || {};
  let monthlyData = stations[stationName];

  // 폴백
  if (!monthlyData) {
    if (stationName === '계룡') monthlyData = [9.8, 5.7, 1.7, 2.2, 2.8, 2.3, 5.5, 4.2, 3.1, 1.8, 1.2, 6.3];
    else if (stationName === '송악') monthlyData = [4.5, 2.9, 0.8, 1.3, 2.1, 1.2, 3.8, 5.2, 3.2, 1.2, 1.4, 4.2];
    else monthlyData = [5.0, 3.0, 1.5, 2.0, 2.5, 2.0, 5.0, 4.5, 3.0, 1.5, 1.0, 4.5];
  }

  let remainingWorkDays = workDays;
  let curMonthIdx = (startMonth - 1) % 12;
  let totalWeatherNonWork = 0;

  while (remainingWorkDays > 0) {
    const workThisMonth = Math.min(remainingWorkDays, 22);
    const monthRatio = workThisMonth / 22;
    totalWeatherNonWork += (monthlyData[curMonthIdx] * monthRatio);

    remainingWorkDays -= workThisMonth;
    curMonthIdx = (curMonthIdx + 1) % 12;
  }

  // 주휴일(작업 5일당 약 2일) 및 겹침 보정
  const holidayDays = Math.ceil(workDays * (2 / 5));
  const finalNonWork = Math.ceil((totalWeatherNonWork + holidayDays) * 0.85);

  return {
    weatherOnly: Math.round(totalWeatherNonWork * 10) / 10,
    totalNonWork: finalNonWork
  };
}

function renderProjectCards() {
  const db = loadDB();
  const container = document.getElementById('project-list-container');
  const projects = db.projects || [];
  const quantities = db.quantities || [];

  if (!projects.length) {
    container.innerHTML = '<div class="panel" style="grid-column:1/-1; text-align:center; padding:40px; color:#94a3b8;">등록된 공사 현장이 없습니다. 신규 현장을 등록하세요.</div>';
    return;
  }

  container.innerHTML = projects.map(p => {
    const pQuants = quantities.filter(q => q.projectId === p.id);
    const netDays = pQuants.reduce((acc, cur) => acc + (cur.workDays || 0), 0);
    const stName = p.station || '계룡';

    let totalNonWork = 0;
    pQuants.forEach(q => {
      const res = calculateStationNonWorkDays(stName, q.workDays || 0, 3);
      totalNonWork += res.totalNonWork;
    });

    const totalCalendarDays = netDays + totalNonWork;
    const sDate = p.startDate || p.start || '2026-03-01';
    const eDate = p.endDate || p.end || '2027-02-28';

    return `
      <div class="project-card">
        <div>
          <div class="project-card-head">
            <div class="project-name">${p.name}</div>
            <span class="badge" style="background:#ecfdf5; color:#16a34a; font-weight:600;">${p.status || '공사중'}</span>
          </div>
          <div class="project-meta">
            • 공사 기간: <strong>${sDate} ~ ${eDate}</strong><br>
            • 매핑 관측소: <strong style="color:var(--primary);">${stName} (10개년 월평균 연동)</strong><br>
            • 순 작업일수: <strong>${netDays}일</strong> (등록 물량 ${pQuants.length}건)<br>
            • 10년 통계 기반 비작업일: <strong style="color:#d97706;">+${totalNonWork}일</strong><br>
            • <strong>최종 산정 총 공사기간: ${totalCalendarDays}일</strong><br>
            • 위치/비고: ${p.addr || p.desc || '특이사항 없음'}
          </div>
        </div>
        <div class="row gap-8" style="margin-top:12px;">
          <a href="quantity.html" class="btn btn-sm" style="flex:1; text-align:center; text-decoration:none;">물량 산정</a>
          <a href="schedule.html" class="btn btn-sm" style="flex:1; text-align:center; text-decoration:none;">공정표</a>
          <button class="btn btn-sm" style="color:#ef4444; border-color:#fca5a5;" onclick="deleteProject('${p.id}')">삭제</button>
        </div>
      </div>
    `;
  }).join('');
}

function initGanttProjectSelector() {
  const db = loadDB();
  const sel = document.getElementById('sel-gantt-project');
  const projects = db.projects || [];

  sel.innerHTML = projects.map((p, idx) => `
    <option value="${p.id}" ${idx === 0 ? 'selected' : ''}>${p.name}</option>
  `).join('');

  if (projects.length) {
    renderGanttChart(sel.value);
  }
}

function renderGanttChart(projectId) {
  const db = loadDB();
  const body = document.getElementById('gantt-body');
  const scaleHeader = document.getElementById('gantt-scale-header');
  const stationText = document.getElementById('station-applied-text');
  
  const curProj = (db.projects || []).find(p => p.id === projectId);
  const stName = curProj ? (curProj.station || '계룡') : '계룡';
  if (stationText) stationText.textContent = `적용 관측소: [${stName}] 10개년(2016~2025) 전체 월평균 통계 연동 완료`;

  const quants = (db.quantities || []).filter(q => q.projectId === projectId);

  if (!quants.length) {
    scaleHeader.innerHTML = '<span class="scale-mark">진행 공정 없음</span>';
    body.innerHTML = `
      <div style="text-align:center; padding:35px; color:#94a3b8; font-size:13px;">
        현재 선택된 현장에 등록된 공사 물량이 없습니다.<br>
        [공사 물량·생산성 산정] 메뉴에서 물량을 추가하면 연속 공정 타임라인이 자동으로 구성됩니다.
      </div>
    `;
    return;
  }

  let currentStartMonth = 3;
  const scheduleChain = quants.map(q => {
    const net = q.workDays || 1;
    const nw = calculateStationNonWorkDays(stName, net, currentStartMonth);
    const calDays = net + nw.totalNonWork;
    return {
      ...q,
      netDays: net,
      nonWorkDays: nw.totalNonWork,
      calendarDays: calDays
    };
  });

  const totalCalendarDays = scheduleChain.reduce((s, c) => s + c.calendarDays, 0);

  scaleHeader.innerHTML = `
    <span class="scale-mark">착공 (0일)</span>
    <span class="scale-mark">${Math.round(totalCalendarDays * 0.25)}일차</span>
    <span class="scale-mark">${Math.round(totalCalendarDays * 0.5)}일차</span>
    <span class="scale-mark">${Math.round(totalCalendarDays * 0.75)}일차</span>
    <span class="scale-mark">최종 준공 (${totalCalendarDays}일차)</span>
  `;

  let currentOffsetDay = 0;
  const colors = ['#2563eb', '#059669', '#d97706', '#7c3aed', '#db2777', '#0891b2'];

  body.innerHTML = scheduleChain.map((item, idx) => {
    const startDay = currentOffsetDay;
    const workEndDay = startDay + item.netDays;
    const finalEndDay = startDay + item.calendarDays;
    currentOffsetDay = finalEndDay;

    const leftPct = ((startDay / totalCalendarDays) * 100).toFixed(2);
    const workWidthPct = ((item.netDays / totalCalendarDays) * 100).toFixed(2);
    const nonWorkWidthPct = ((item.nonWorkDays / totalCalendarDays) * 100).toFixed(2);
    const color = colors[idx % colors.length];

    return `
      <div class="gantt-item-row">
        <div class="gantt-item-label" title="${item.name}">
          <span class="badge" style="background:#f1f5f9; color:#475569; font-size:11px; margin-right:4px;">${item.category || '공종'}</span>
          ${item.name}
        </div>
        <div class="gantt-timeline-track">
          <div class="gantt-bar-work" 
               style="left:${leftPct}%; width:${workWidthPct}%; background:${color};"
               title="${item.name}&#10;• 순 작업일수: ${item.netDays}일 (${startDay}일차 ~ ${workEndDay}일차)">
            ${item.name} (${item.netDays}일)
          </div>
          <div class="gantt-bar-weather" 
               style="left:${parseFloat(leftPct) + parseFloat(workWidthPct)}%; width:${nonWorkWidthPct}%;"
               title="${stName} 10개년 통계 비작업일: +${item.nonWorkDays}일&#10;(${workEndDay}일차 ~ ${finalEndDay}일차)">
            +${item.nonWorkDays}일 (10년 통계)
          </div>
        </div>
        <div style="width: 140px; text-align: right; color: #1e293b;" class="mono">
          <span style="color:#2563eb; font-weight:700;">${item.netDays}일</span> + 
          <span style="color:#d97706; font-weight:700;">${item.nonWorkDays}일</span> = 
          <strong>${item.calendarDays}일</strong>
        </div>
      </div>
    `;
  }).join('');
}

function openNewProjectModal() {
  document.getElementById('m-inp-name').value = '';
  document.getElementById('m-inp-addr').value = '';
  document.getElementById('m-inp-desc').value = '';
  document.getElementById('addr-match-guide').innerHTML = '';
  document.getElementById('modal-project').style.display = 'flex';
}

function closeModal() {
  document.getElementById('modal-project').style.display = 'none';
}

function saveNewProject() {
  const name = document.getElementById('m-inp-name').value.trim();
  const start = document.getElementById('m-inp-start').value;
  const end = document.getElementById('m-inp-end').value;
  const addr = document.getElementById('m-inp-addr').value.trim();
  const station = document.getElementById('m-sel-station').value;
  const desc = document.getElementById('m-inp-desc').value.trim();

  if (!name) {
    alert('공사 현장명을 입력해 주세요.');
    return;
  }

  const db = loadDB();
  const newProject = {
    id: 'P_' + Date.now(),
    name: name,
    startDate: start,
    endDate: end,
    addr: addr,
    station: station,
    desc: desc,
    status: '공사중'
  };

  if (!db.projects) db.projects = [];
  db.projects.push(newProject);
  saveDB(db);

  closeModal();
  renderProjectCards();
  initGanttProjectSelector();
  alert(`신규 현장 '${name}' 등록 완료!\n관측소 [${station}]의 10개년 월평균 비작업일수 전체 통계가 자동 연동되었습니다.`);
}

function deleteProject(pid) {
  if (!confirm('현장을 삭제하시겠습니까? 등록된 물량 내역도 함께 삭제될 수 있습니다.')) return;
  const db = loadDB();
  db.projects = (db.projects || []).filter(p => p.id !== pid);
  db.quantities = (db.quantities || []).filter(q => q.projectId !== pid);
  saveDB(db);

  renderProjectCards();
  initGanttProjectSelector();
}
</script>
</body>
</html>
